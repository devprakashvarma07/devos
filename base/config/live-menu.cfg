set timeout=1
set default=0

menuentry "DevOS 2.0 (live)" {
    linux /boot/vmlinuz boot=devos quiet loglevel=3 nowatchdog mitigations=off vt.global_cursor_default=0 console=tty0 console=ttyS0,115200n8
    initrd /boot/initrd.img
}

menuentry "DevOS 2.0 (live, debug)" {
    linux /boot/vmlinuz boot=devos loglevel=7 console=tty0 console=ttyS0,115200n8
    initrd /boot/initrd.img
}
